<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #14131a; --panel: #1d1b26; --ink: #e8e4f0;
      --dim: #8f88a6; --accent: #c9a7ff; --mine: #2a2438; --theirs: #221f30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink); height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 18px; background: var(--panel);
      border-bottom: 1px solid #2c2838; display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .5px; }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: #7cf0a1; }
    #thread {
      flex: 1; overflow-y: auto; padding: 18px; display: flex;
      flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 82%; padding: 10px 14px; border-radius: 14px;
      line-height: 1.45; font-size: 14.5px; white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
    .model { align-self: flex-start; background: var(--theirs); border-bottom-left-radius: 4px; }
    .meta { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
    footer {
      padding: 12px 14px; background: var(--panel); border-top: 1px solid #2c2838;
      display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; height: 48px; padding: 12px; border-radius: 10px;
      background: #14131a; color: var(--ink); border: 1px solid #332e42;
      font-size: 14.5px; font-family: inherit;
    }
    textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    button {
      padding: 0 16px; height: 48px; border-radius: 10px; border: none;
      background: var(--accent); color: #1a1426; font-weight: 700;
      cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .toggle {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      color: var(--dim); padding-bottom: 4px;
    }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>PANN</h1>
  </header>

  <div id="thread"></div>

  <footer>
    <div class="toggle" title="Fold Apps Script reference into the system prompt">
      <input type="checkbox" id="scriptRef" checked>
      <label for="scriptRef">Apps Script mode</label>
    </div>
    <textarea id="input" placeholder="Ask anything, LO…"></textarea>
    <button id="send">Send</button>
  </footer>

  <script>
    const thread = document.getElementById('thread');
    const input  = document.getElementById('input');
    const send   = document.getElementById('send');
    const refChk = document.getElementById('scriptRef');

    let history = [];  // [{role, parts:[{text}]}]

    function addBubble(kind, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + kind;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = kind === 'user' ? 'LO' : 'PANN';
      const body = document.createElement('div');
      body.textContent = text;
      wrap.appendChild(meta);
      wrap.appendChild(body);
      thread.appendChild(wrap);
      thread.scrollTop = thread.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addBubble('user', text);
      input.value = '';
      send.disabled = true;

      const thinking = document.createElement('div');
      thinking.className = 'msg model';
      thinking.textContent = '…';
      thread.appendChild(thinking);
      thread.scrollTop = thread.scrollHeight;

      google.script.run
        .withSuccessHandler(res => {
          thinking.remove();
          if (res && res.reply) {
            addBubble('model', res.reply);
            history = res.history || history;
          } else {
            addBubble('model', '[no reply]');
          }
          send.disabled = false;
          input.focus();
        })
        .withFailureHandler(err => {
          thinking.remove();
          addBubble('model', '[error] ' + err.message);
          send.disabled = false;
        })
        .doPost({
          postData: {
            contents: JSON.stringify({
              message: text,
              useScriptRef: refChk.checked,
              history: history,
            })
          }
        });
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.focus();
  </script>
</body>
</html>
